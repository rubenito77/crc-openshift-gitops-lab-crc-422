apiVersion: v1
kind: ConfigMap
metadata:
  name: app-demo-content
  labels:
    app.kubernetes.io/name: app-demo
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: crc-gitops-lab
data:
  index.html: |
    <!doctype html>
    <html lang="es">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>CRC OpenShift GitOps Lab</title>
        <style>
          body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #17212b;
          }
          main {
            width: min(720px, 90%);
            padding: 2rem;
            border-top: 6px solid #ee0000;
            border-radius: 8px;
            background: white;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
          }
          h1 {
            margin-top: 0;
            color: #a30000;
          }
          code {
            padding: 0.15rem 0.35rem;
            border-radius: 4px;
            background: #eef1f4;
          }
        </style>
      </head>
      <body>
        <main>
          <h1>OpenShift GitOps en CRC</h1>
          <p>Aplicacion desplegada declarativamente mediante Argo CD.</p>
          <p>Ambiente: <code>dev</code></p>
          <p>Cluster: <code>OpenShift 4.22.1 sobre CRC</code></p>
        </main>
      </body>
    </html>
