apiVersion: v1
kind: ConfigMap
metadata:
  name: app-demo-content
  labels:
    app.kubernetes.io/name: app-demo
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: crc-gitops-lab
data:
  index.html: |
    <!doctype html>
    <html lang="es">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>CRC OpenShift GitOps Lab - V2</title>
        <style>
          body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eaf2ff, #f7f9fc);
            color: #17212b;
          }
          main {
            width: min(720px, 90%);
            padding: 2rem;
            border-top: 6px solid #0066cc;
            border-radius: 12px;
            background: white;
            box-shadow: 0 12px 32px rgba(0, 65, 130, 0.18);
          }
          .version-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            margin-bottom: 1rem;
            padding: 0.45rem 0.8rem;
            border-radius: 999px;
            background: #0066cc;
            color: white;
            font-weight: 700;
            letter-spacing: 0.04em;
          }
          .version-badge small {
            padding-left: 0.55rem;
            border-left: 1px solid rgba(255, 255, 255, 0.55);
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: normal;
          }
          h1 {
            margin-top: 0;
            color: #004b95;
          }
          .release-note {
            padding: 0.85rem 1rem;
            border-left: 4px solid #0066cc;
            border-radius: 4px;
            background: #edf5ff;
          }
          code {
            padding: 0.15rem 0.35rem;
            border-radius: 4px;
            background: #eef1f4;
          }
        </style>
      </head>
      <body>
        <main>
          <div class="version-badge">
            <span>V2</span>
            <small>Version 2</small>
          </div>
          <h1>OpenShift GitOps en CRC</h1>
          <p>Aplicacion desplegada declarativamente mediante Argo CD.</p>
          <p class="release-note">
            V2 incorpora una nueva identidad visual y queda preparada para demostrar rollback.
          </p>
          <p>Ambiente: <code>dev</code></p>
          <p>Cluster: <code>OpenShift 4.22.1 sobre CRC</code></p>
        </main>
      </body>
    </html>
